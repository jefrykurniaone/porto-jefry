# SonarQube Cloud analysis. Read docs/sonarcloud-analysis.md before changing anything here.

sonar.organization=jefry-kurniawan
sonar.projectKey=jefrykurniaone_porto-jefry
sonar.sourceEncoding=UTF-8

# `.` rather than a list of directories, deliberately. A list silently drops whatever it forgets to
# name: the root configuration files, scripts/ and .github/workflows, whose `githubactions:*` rules
# only the server reports, since SonarLint in the editor does not analyse workflow YAML at all.
sonar.sources=.

# Build output and dependencies. `.claude` holds sub-agent worktrees, whole copies of this repository
# that would otherwise be analysed as part of it.
sonar.exclusions=.next/**,out/**,build/**,coverage/**,node_modules/**,.claude/**

# No `sonar.tests` and no coverage report: the test suite was removed in #43. Without a report Sonar
# still counts every changed JavaScript and TypeScript line as uncovered, so the gate's 80% coverage
# condition fails any pull request that touches code (first seen on PR #112). Nothing is
# instrumented, so nothing is in coverage scope. Narrow this when tests come back; do not delete it
# to "fix" a coverage number.
sonar.coverage.exclusions=**/*

# Fail the pipeline when the quality gate fails, rather than posting a status nobody is blocked by.
sonar.qualitygate.wait=true
